services:
  gistdb-client:
    build:
      context: ..
      dockerfile: client/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - GISTDB_SERVICE_URL=${GISTDB_SERVICE_URL}
      # Optional: set both to use a real signed certificate instead of the self-signed one.
      # Mount the cert/key files into the container and point these vars at the mounted paths.
      - TLS_CERT_FILE=${TLS_CERT_FILE:-}
      - TLS_KEY_FILE=${TLS_KEY_FILE:-}
    volumes:
      - ../credentials.json:/data/credentials.json:ro
    networks:
      - tunnel-net

networks:
  tunnel-net:
    external: true
