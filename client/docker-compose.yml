services:
  gistdb-client:
    build:
      context: ..
      dockerfile: client/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - GISTDB_SERVICE_URL=${GISTDB_SERVICE_URL}
    volumes:
      - ./credentials.json:/data/credentials.json:ro
    networks:
      - tunnel-net

networks:
  tunnel-net:
    external: true
