<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GistDB Admin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231a1a1a'/><path d='M7 11v10c0 2.2 4 4 9 4s9-1.8 9-4V11' fill='%232563eb'/><ellipse cx='16' cy='11' rx='9' ry='3.5' fill='%233b82f6'/><ellipse cx='16' cy='17' rx='9' ry='3.5' fill='none' stroke='%2393c5fd' stroke-width='1.2'/><ellipse cx='16' cy='21' rx='9' ry='3.5' fill='%231d4ed8'/></svg>">
<script>
  // Runs before first paint so a stored preference never flashes the other theme.
  // No stored value means "auto": Pico falls back to prefers-color-scheme.
  (() => {
    const t = localStorage.getItem('theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
  /* Pico handles typography, form controls, buttons, tables, dialogs and the
     light/dark palette. Everything below is app-shell layout Pico doesn't cover. */

  :root {
    --pico-font-size: 87.5%;
    --pico-line-height: 1.45;
    --pico-border-radius: 0.25rem;
    --pico-form-element-spacing-vertical: 0.4rem;
    --pico-form-element-spacing-horizontal: 0.6rem;
    --mono: var(--pico-font-family-monospace, 'SF Mono', 'Fira Code', monospace);
  }

  body {
    margin: 0;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Pico sizes buttons to fill their container; in a toolbar we want them snug. */
  button, [role="button"] { width: auto; }

  button.danger,
  button.danger:is(:hover, :active, :focus) {
    --pico-background-color: #c0392b;
    --pico-border-color: #c0392b;
    --pico-color: #fff;
  }
  button.danger:is(:hover, :active) {
    --pico-background-color: #a5301f;
    --pico-border-color: #a5301f;
  }

  .app-bar, .toolbar, .status-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.5rem 1rem;
    background: var(--pico-card-sectioning-background-color);
  }

  .app-bar { border-bottom: 1px solid var(--pico-muted-border-color); }
  .app-bar h1 { font-size: 1rem; margin: 0; white-space: nowrap; }
  .app-bar mark { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; }

  .toolbar { border-bottom: 1px solid var(--pico-muted-border-color); }
  .toolbar label { margin: 0; color: var(--pico-muted-color); white-space: nowrap; }
  .toolbar select { width: 14rem; margin: 0; }

  .push-right { margin-left: auto; }

  .theme-toggle {
    font-size: 0.95rem;
    line-height: 1;
    padding-inline: 0.7rem;
  }

  .workspace { display: flex; flex: 1; overflow: hidden; }

  .sidebar {
    width: 15rem;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid var(--pico-muted-border-color);
  }

  .sidebar > h2 {
    margin: 0;
    padding: 0.6rem 0.75rem;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--pico-muted-color);
    border-bottom: 1px solid var(--pico-muted-border-color);
  }

  .doc-list {
    flex: 1;
    overflow-y: auto;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .doc-list li {
    padding: 0.45rem 0.75rem;
    font-family: var(--mono);
    font-size: 0.75rem;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border-bottom: 1px solid var(--pico-muted-border-color);
  }

  .doc-list li:hover { background: var(--pico-card-sectioning-background-color); }

  .doc-list li.active {
    background: var(--pico-primary-background);
    color: var(--pico-primary-inverse);
    font-weight: 600;
  }

  .doc-list .empty {
    font-family: inherit;
    font-size: inherit;
    color: var(--pico-muted-color);
    cursor: default;
    border-bottom: none;
    padding: 1rem 0.75rem;
  }
  .doc-list .empty:hover { background: none; }

  .doc-panel {
    flex: 1;
    overflow-y: auto;
    padding: 1rem 1.25rem;
  }

  .doc-panel .placeholder {
    color: var(--pico-muted-color);
    text-align: center;
    margin-top: 3rem;
  }

  .doc-panel article { margin: 0 0 1rem; padding: 0.75rem 1rem; }
  .doc-panel table { margin: 0; font-size: 0.8rem; }
  .doc-panel td { padding: 0.15rem 0; border: none; }
  .doc-panel td:first-child { width: 7rem; color: var(--pico-muted-color); }
  .doc-panel td:last-child { font-family: var(--mono); word-break: break-all; }

  .field-label {
    display: block;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--pico-muted-color);
  }

  textarea.code {
    font-family: var(--mono);
    font-size: 0.75rem;
    line-height: 1.6;
    min-height: 16rem;
    resize: vertical;
  }

  dialog textarea.code { min-height: 10rem; }

  .actions { display: flex; gap: 0.5rem; }
  .actions.right { justify-content: flex-end; }

  .status-bar {
    border-top: 1px solid var(--pico-muted-border-color);
    font-size: 0.75rem;
    color: var(--pico-muted-color);
    min-height: 2rem;
  }
  .status-bar.ok    { color: #16a34a; }
  .status-bar.error { color: var(--pico-del-color, #c0392b); }

  dialog article { margin: 0; }
  dialog article > header, dialog article > footer { padding: 0.75rem 1rem; }
  dialog h2 { font-size: 1rem; margin: 0; }
  dialog input[readonly] { font-family: var(--mono); }

  @media (max-width: 640px) {
    .app-bar, .toolbar { flex-wrap: wrap; }
    .toolbar select { flex: 1; width: auto; }
    .workspace { flex-direction: column; }
    .sidebar {
      width: 100%;
      height: 11rem;
      border-right: none;
      border-bottom: 1px solid var(--pico-muted-border-color);
    }
    .doc-panel { padding: 0.75rem; }
  }
</style>
</head>

<body x-data="admin" x-init="fetchCollections()">

<header class="app-bar">
  <h1>GistDB Admin</h1>
  <button class="secondary outline push-right theme-toggle" @click="toggleTheme()"
          :aria-label="'Switch to ' + (isDark ? 'light' : 'dark') + ' mode'"
          :title="'Switch to ' + (isDark ? 'light' : 'dark') + ' mode'"
          x-text="isDark ? '☀' : '☾'"></button>
  {{if .DemoMode}}
    <mark>Demo mode — read only</mark>
  {{else}}
    <button class="secondary outline" onclick="window.location='/logout'">Logout</button>
  {{end}}
</header>

<nav class="toolbar">
  <label for="collection">Collection</label>
  <select id="collection" x-model="collection" @change="loadCollection()">
    <option value="">— select —</option>
    <template x-for="c in collections" :key="c">
      <option :value="c" x-text="c"></option>
    </template>
  </select>
  {{if not .DemoMode}}<button @click="openNewDoc()">+ New Document</button>{{end}}
  <button class="secondary push-right" @click="clearCache()" {{if .DemoMode}}disabled{{end}}>Clear DB Cache</button>
</nav>

<div class="workspace">
  <aside class="sidebar">
    <h2>Documents</h2>
    <ul class="doc-list">
      <li class="empty" x-show="!ids.length" x-text="collection ? 'No documents in this collection' : 'Load a collection to begin'"></li>
      <template x-for="id in ids" :key="id">
        <li :class="{ active: id === currentId }" @click="loadDocument(id)" x-text="id"></li>
      </template>
    </ul>
  </aside>

  <section class="doc-panel">
    <p class="placeholder" x-show="!doc">Select a document from the list</p>

    <div x-show="doc" style="display:none">
      <article>
        <table>
          <tbody>
            <template x-for="row in metaRows" :key="row[0]">
              <tr><td x-text="row[0]"></td><td x-text="row[1]"></td></tr>
            </template>
          </tbody>
        </table>
      </article>

      <label class="field-label" for="data-editor">data</label>
      <textarea id="data-editor" class="code" spellcheck="false"
                x-model="editor" {{if .DemoMode}}readonly{{end}}></textarea>

      {{if not .DemoMode}}
      <div class="actions">
        <button @click="saveDocument()">Save</button>
        <button class="danger" @click="deleteDocument()">Delete</button>
        <button class="secondary outline" @click="stringify('editor')" :disabled="stringified.editor"
                x-text="stringified.editor ? 'Converted' : 'Convert to JSON string'"></button>
      </div>
      {{end}}
    </div>
  </section>
</div>

<footer class="status-bar" :class="status.type" x-text="status.msg">Ready</footer>

{{if not .DemoMode}}
<dialog :open="newDoc.open" @click.self="newDoc.open = false" @keydown.escape.window="newDoc.open = false">
  <article>
    <header><h2>New Document</h2></header>

    <label class="field-label" for="new-collection">Collection</label>
    <input id="new-collection" type="text" placeholder="e.g. users" x-model="newDoc.collection" x-ref="newCollection">

    <label class="field-label" for="new-data">Data (JSON)</label>
    <textarea id="new-data" class="code" spellcheck="false" x-model="newDoc.data"></textarea>
    <button class="secondary outline" @click="stringify('newData')" :disabled="stringified.newData"
            x-text="stringified.newData ? 'Converted' : 'Convert to JSON string'"></button>

    <footer class="actions right">
      <button class="secondary" @click="newDoc.open = false">Cancel</button>
      <button @click="createDocument()">Create</button>
    </footer>
  </article>
</dialog>
{{end}}

<dialog :open="created.open" @keydown.escape.window="created.open = false">
  <article>
    <header><h2>Document Created</h2></header>

    <label class="field-label" for="created-id">Document ID</label>
    <input id="created-id" type="text" readonly :value="created.id">

    <label class="field-label" for="created-collection">Collection</label>
    <input id="created-collection" type="text" readonly :value="created.collection">

    <footer class="actions right">
      <button @click="created.open = false">OK</button>
    </footer>
  </article>
</dialog>

<script>
  document.addEventListener('alpine:init', () => {
    Alpine.data('admin', () => ({
      collections: [],
      collection: '',
      ids: [],
      currentId: '',
      doc: null,
      editor: '',
      status: { msg: 'Ready', type: '' },
      stringified: { editor: false, newData: false },
      newDoc: { open: false, collection: '', data: '' },
      created: { open: false, id: '', collection: '' },

      // '' means auto (follow the OS); 'light'/'dark' are explicit overrides.
      theme: localStorage.getItem('theme') || '',
      systemDark: false,

      init() {
        const mq = window.matchMedia('(prefers-color-scheme: dark)');
        this.systemDark = mq.matches;
        // Keep the icon honest if the OS flips while we are still on auto.
        mq.addEventListener('change', e => { this.systemDark = e.matches; });
      },

      get isDark() {
        return this.theme ? this.theme === 'dark' : this.systemDark;
      },

      toggleTheme() {
        this.theme = this.isDark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', this.theme);
        localStorage.setItem('theme', this.theme);
      },

      setStatus(msg, type = '') {
        this.status = { msg, type };
      },

      // Calls the server-side proxy; the JWT is attached by the Go server.
      async apiFetch(path, options = {}) {
        const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
        const res = await fetch('/api' + path, { ...options, headers });
        if (!res.ok) {
          const text = await res.text();
          throw new Error(`${res.status} ${res.statusText}: ${text.trim()}`);
        }
        return res.json();
      },

      async fetchCollections() {
        try {
          const data = await this.apiFetch('/collections_list');
          this.collections = data.collections || [];
        } catch (e) {
          console.error(e);
          this.setStatus('Collections failed: ' + e.message, 'error');
        }
      },

      async loadCollection() {
        if (!this.collection) return;
        this.setStatus('Loading…');
        try {
          const data = await this.apiFetch(`/collections/${encodeURIComponent(this.collection)}`);
          this.ids = data.ids || [];
          this.clearDoc();
          this.setStatus(`Loaded ${this.ids.length} document(s) from "${this.collection}"`, 'ok');
        } catch (e) {
          this.setStatus(e.message, 'error');
        }
      },

      async loadDocument(id) {
        this.setStatus('Loading…');
        this.currentId = id;
        try {
          const res = await this.apiFetch(
            `/collections/${encodeURIComponent(this.collection)}/${encodeURIComponent(id)}`
          );
          this.doc = res.content || {};
          this.editor = JSON.stringify(this.doc.data ?? {}, null, 2);
          this.stringified.editor = false;
          this.setStatus(`Loaded ${id}`, 'ok');
        } catch (e) {
          this.setStatus(e.message, 'error');
        }
      },

      clearDoc() {
        this.currentId = '';
        this.doc = null;
        this.editor = '';
        this.stringified.editor = false;
      },

      get metaRows() {
        const c = this.doc || {};
        const rows = [
          ['id', c.id || ''],
          ['collection', c.collection || ''],
          ['createdAt', c.createdAt || ''],
        ];
        if (c.modifiedAt) rows.push(['modifiedAt', c.modifiedAt]);
        return rows;
      },

      async saveDocument() {
        if (!this.currentId) return;
        let parsed;
        try {
          parsed = JSON.parse(this.editor);
        } catch (e) {
          this.setStatus('Invalid JSON: ' + e.message, 'error');
          return;
        }

        this.setStatus('Saving…');
        try {
          await this.apiFetch(
            `/collections/${encodeURIComponent(this.collection)}/${encodeURIComponent(this.currentId)}`,
            { method: 'PATCH', body: JSON.stringify({ data: parsed }) }
          );
          this.setStatus(`Saved ${this.currentId}`, 'ok');
        } catch (e) {
          this.setStatus(e.message, 'error');
        }
      },

      async deleteDocument() {
        if (!this.currentId) return;
        if (!confirm(`Delete "${this.currentId}" from "${this.collection}"?`)) return;

        const id = this.currentId;
        this.setStatus('Deleting…');
        try {
          await this.apiFetch(
            `/collections/${encodeURIComponent(this.collection)}/${encodeURIComponent(id)}`,
            { method: 'DELETE' }
          );
          this.ids = this.ids.filter(x => x !== id);
          this.clearDoc();
          this.setStatus('Document deleted', 'ok');
        } catch (e) {
          this.setStatus(e.message, 'error');
        }
      },

      openNewDoc() {
        this.newDoc = { open: true, collection: this.collection || '', data: '' };
        this.stringified.newData = false;
        this.$nextTick(() => this.$refs.newCollection?.focus());
      },

      async createDocument() {
        const col = this.newDoc.collection.trim();
        if (!col) {
          this.$refs.newCollection.focus();
          return;
        }
        let parsed;
        try {
          parsed = JSON.parse(this.newDoc.data);
        } catch (e) {
          this.setStatus('Invalid JSON: ' + e.message, 'error');
          return;
        }

        this.setStatus('Creating…');
        try {
          const res = await this.apiFetch(`/collections/${encodeURIComponent(col)}`, {
            method: 'POST',
            body: JSON.stringify({ data: parsed }),
          });
          this.newDoc.open = false;
          this.setStatus(`Created ${res.id} in "${col}"`, 'ok');
          if (col === this.collection) this.ids.push(res.id);
          this.created = { open: true, id: res.id, collection: col };
        } catch (e) {
          this.setStatus(e.message, 'error');
        }
      },

      // Wrap the raw editor text as a JSON string literal, for storing data
      // that is itself a string rather than an object.
      stringify(target) {
        if (target === 'editor') this.editor = JSON.stringify(this.editor);
        else this.newDoc.data = JSON.stringify(this.newDoc.data);
        this.stringified[target] = true;
      },

      async clearCache() {
        this.setStatus('Clearing cache…');
        try {
          await this.apiFetch('/clear_cache', { method: 'POST' });
          this.setStatus('Cache cleared', 'ok');
          alert('Cache cleared successfully');
        } catch (e) {
          this.setStatus(e.message, 'error');
        }
      },
    }));
  });
</script>
</body>
</html>
